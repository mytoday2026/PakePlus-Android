        function renderNotes() {
            const group = data.groups.find(g => g.id === currentGroupId);
            if (!group) { switchView('home'); return; }
            const topic = group.topics.find(t => t.id === currentTopicId);
            if (!topic) { switchView('topics'); return; }
            document.getElementById('notesTopicName').textContent = topic.name;

            const container = document.getElementById('notesList');
            const topicNotes = getNotesByTopic(topic.id);
            const total = topicNotes.length;
            const totalPages = Math.max(1, Math.ceil(total / NOTES_PER_PAGE));
            if (currentNotesPage > totalPages) currentNotesPage = totalPages;
            const pageNotes = topicNotes.slice((currentNotesPage - 1) * NOTES_PER_PAGE, currentNotesPage * NOTES_PER_PAGE);

            if (pageNotes.length === 0) {
                container.innerHTML = '<div class="empty-tip">暂无记事，在上方输入框添加</div>';
            } else {
                container.innerHTML = pageNotes.map(note => {
                    let mentionsHtml = '';
                    if (note.mentions && note.mentions.length > 0) {
                        const chips = note.mentions.map(mid => {
                            const info = getTopicGroup(mid);
                            if (!info) return '';
                            return `<span class="note-mention-chip" data-topic-id="${mid}" data-group-id="${info.group.id}">@${escapeHtml(info.topic.name)}</span>`;
                        }).filter(Boolean).join('');
                        if (chips) mentionsHtml = `<div class="note-mentions">${chips}</div>`;
                    }
                    let sourceHint = '';
                    if (note.sourceTopicId) {
                        const info = getTopicGroup(note.sourceTopicId);
                        if (info) {
                            sourceHint = `<div style="font-size:0.7rem;color:var(--text-light);margin-bottom:4px;">↩ 来自 @${escapeHtml(info.topic.name)} 的复制</div>`;
                        }
                    }
                    return `
                        <div class="note-item" data-note-id="${note.id}">
                            <div class="note-item-header">
                                <span class="note-date">${formatFullTime(note.createdAt)}</span>
                                <div class="note-actions">
                                    <button class="btn btn-sm btn-outline edit-note" data-id="${note.id}">编辑</button>
                                    <button class="btn btn-sm btn-danger delete-note" data-id="${note.id}">删除</button>
                                </div>
                            </div>
                            ${sourceHint}
                            <div class="note-content">${escapeHtml(note.content)}</div>
                            ${mentionsHtml}
                        </div>
                    `;
                }).join('');
            }

            const pagination = document.getElementById('notesPagination');
            if (totalPages > 1) {
                pagination.innerHTML = `
                    <button class="page-btn" id="prevPage" ${currentNotesPage <= 1 ? 'disabled' : ''}>上一页</button>
                    <span class="page-info">${currentNotesPage} / ${totalPages}</span>
                    <button class="page-btn" id="nextPage" ${currentNotesPage >= totalPages ? 'disabled' : ''}>下一页</button>
                `;
                pagination.querySelector('#prevPage').onclick = () => { if (currentNotesPage > 1) { currentNotesPage--; renderNotes(); } };
                pagination.querySelector('#nextPage').onclick = () => { if (currentNotesPage < totalPages) { currentNotesPage++; renderNotes(); } };
            } else {
                pagination.innerHTML = '';
            }

            container.querySelectorAll('.note-mention-chip').forEach(chip => {
                chip.onclick = () => {
                    currentGroupId = chip.dataset.groupId;
                    currentTopicId = chip.dataset.topicId;
                    currentNotesPage = 1;
                    switchView('notes');
                };
            });

            container.querySelectorAll('.edit-note').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const note = data.notes.find(n => n.id === btn.dataset.id);
                    if (note) showNoteContentModal(note, note.groupId, note.topicId);
                };
            });
            container.querySelectorAll('.delete-note').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const note = data.notes.find(n => n.id === btn.dataset.id);
                    if (!note) return;
                    const ok = await confirmDelete('确定删除这条记事吗？');
                    if (ok) {
                        deleteNote(note.id);
                        renderNotes();
                        showToast('已删除');
                    }
                };
            });

            renderBacklinks(topic.id);
        }

        function renderBacklinks(topicId) {
            const section = document.getElementById('backlinkSection');
            const listEl = document.getElementById('backlinkList');

            const backlinks = data.notes.filter(n =>
                n.topicId !== topicId &&
                n.mentions && n.mentions.includes(topicId)
            ).sort((a, b) => b.createdAt - a.createdAt);

            if (backlinks.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            listEl.innerHTML = backlinks.map(note => {
                const info = getTopicGroup(note.topicId);
                const sourceName = info ? info.topic.name : '未知主题';
                return `
                    <div class="backlink-item">
                        <div class="backlink-source" data-topic-id="${note.topicId}" data-group-id="${info ? info.group.id : ''}">
                            🔗 来自「${escapeHtml(sourceName)}」
                        </div>
                        <div class="backlink-content">${escapeHtml(note.content)}</div>
                        <div class="backlink-date">${formatFullTime(note.createdAt)}</div>
                    </div>
                `;
            }).join('');

            listEl.querySelectorAll('.backlink-source').forEach(el => {
                el.onclick = () => {
                    if (!el.dataset.groupId) return;
                    currentGroupId = el.dataset.groupId;
                    currentTopicId = el.dataset.topicId;
                    currentNotesPage = 1;
                    switchView('notes');
                };
            });
        }

        function renderSearchResults() {
            const container = document.getElementById('searchResultsList');
            const kw = searchKeyword.trim().toLowerCase();
            if (!kw) { container.innerHTML = '<div class="empty-tip">输入关键词搜索</div>'; return; }

            const noteResults = data.notes.filter(n => n.content.toLowerCase().includes(kw))
                .sort((a, b) => b.createdAt - a.createdAt);

            const topicResults = [];
            data.groups.forEach(g => {
                g.topics.forEach(t => {
                    if (t.name.toLowerCase().includes(kw)) {
                        topicResults.push({ topic: t, group: g });
                    }
                });
            });

            if (noteResults.length === 0 && topicResults.length === 0) {
                container.innerHTML = '<div class="empty-tip">没有找到匹配的记事或主题</div>';
                return;
            }

            let html = '';

            if (topicResults.length > 0) {
                html += `<div class="search-section-label">📝 主题（${topicResults.length}）</div>`;
                html += topicResults.map(item => {
                    const count = getTopicNoteCount(item.topic.id);
                    return `
                        <div class="topic-item" style="margin-bottom:6px;">
                            <div class="topic-item-left">
                                <span class="topic-name">${escapeHtml(item.topic.name)}</span>
                                <div class="topic-meta">
                                    <span>📂 ${escapeHtml(item.group.name)}</span>
                                    <span>📝 ${count} 条</span>
                                </div>
                            </div>
                            <button class="btn btn-sm btn-primary search-goto-topic"
                                    data-topic-id="${item.topic.id}"
                                    data-group-id="${item.group.id}">↗ 直达</button>
                        </div>
                    `;
                }).join('');
            }

            if (noteResults.length > 0) {
                html += `<div class="search-section-label">✍️ 记事（${noteResults.length}）</div>`;
                html += noteResults.map(note => {
                    const group = data.groups.find(g => g.id === note.groupId);
                    const topic = group ? group.topics.find(t => t.id === note.topicId) : null;
                    const groupName = group ? group.name : '未知分组';
                    const topicName = topic ? topic.name : '未知主题';
                    return `
                        <div class="note-item" data-note-id="${note.id}">
                            <div class="note-item-header">
                                <span class="note-date">${formatFullTime(note.createdAt)}</span>
                                <div class="note-actions">
                                    <button class="btn btn-sm btn-primary search-goto-topic"
                                            data-topic-id="${note.topicId}"
                                            data-group-id="${note.groupId}">↗ 直达</button>
                                    <button class="btn btn-sm btn-outline edit-note" data-id="${note.id}">编辑</button>
                                    <button class="btn btn-sm btn-danger delete-note" data-id="${note.id}">删除</button>
                                </div>
                            </div>
                            <div style="font-size:0.72rem;color:var(--text-light);margin-bottom:4px;">
                                📂 ${escapeHtml(groupName)} · 📝 ${escapeHtml(topicName)}
                            </div>
                            <div class="note-content">${escapeHtml(note.content)}</div>
                        </div>
                    `;
                }).join('');
            }

            container.innerHTML = html;

            container.querySelectorAll('.search-goto-topic').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    currentGroupId = btn.dataset.groupId;
                    currentTopicId = btn.dataset.topicId;
                    currentNotesPage = 1;
                    searchKeyword = '';
                    searchInput.value = '';
                    switchView('notes');
                };
            });

            container.querySelectorAll('.edit-note').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const note = data.notes.find(n => n.id === btn.dataset.id);
                    if (note) showNoteContentModal(note, note.groupId, note.topicId);
                };
            });
            container.querySelectorAll('.delete-note').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const note = data.notes.find(n => n.id === btn.dataset.id);
                    if (!note) return;
                    const ok = await confirmDelete('确定删除这条记事吗？');
                    if (ok) {
                        deleteNote(note.id);
                        renderSearchResults();
                        showToast('已删除');
                    }
                };
            });
        }

        function updateMentionBtnState() {
            if (pendingMentions.size > 0) {
                mentionBtn.classList.add('active');
                mentionBtn.textContent = `@ 关联主题 (${pendingMentions.size})`;
            } else {
                mentionBtn.classList.remove('active');
                mentionBtn.textContent = '@ 关联主题';
            }
        }

        function renderMentionPreview() {
            if (pendingMentions.size === 0) {
                mentionPreviewEl.innerHTML = '';
                return;
            }
            const chips = [];
            pendingMentions.forEach(mid => {
                const info = getTopicGroup(mid);
                if (info) {
                    chips.push(`<span class="mention-chip">@${escapeHtml(info.topic.name)}<span class="remove-x" data-id="${mid}">×</span></span>`);
                }
            });
            mentionPreviewEl.innerHTML = chips.join('');
            mentionPreviewEl.querySelectorAll('.remove-x').forEach(x => {
                x.onclick = () => {
                    pendingMentions.delete(x.dataset.id);
                    renderMentionPreview();
                    updateMentionBtnState();
                };
            });
        }

        function openMentionPanelForSet(targetSet, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'mention-panel';

            let defaultGroupId = currentGroupId;
            if (!defaultGroupId && data.groups.length > 0) defaultGroupId = data.groups[0].id;

            overlay.innerHTML = `
                <div class="mention-panel-inner">
                    <div class="mention-panel-header">
                        <h3>@ 选择要关联的主题</h3>
                        <button class="close-x" id="mentionPanelClose">✕</button>
                    </div>
                    <select class="mention-group-select" id="mentionGroupSelect">
                        ${data.groups.map(g =>
                            `<option value="${g.id}" ${g.id === defaultGroupId ? 'selected' : ''}>${escapeHtml(g.name)}</option>`
                        ).join('')}
                    </select>
                    <div class="mention-topic-grid" id="mentionTopicGrid"></div>
                    <div class="mention-panel-footer">
                        <span class="selected-count" id="mentionSelectedCount">已选 ${targetSet.size} 个</span>
                        <div style="display:flex;gap:8px;">
                            <button class="btn btn-sm btn-outline" id="mentionPanelClear">清空</button>
                            <button class="btn btn-sm btn-primary" id="mentionPanelConfirm">确定</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const groupSelect = overlay.querySelector('#mentionGroupSelect');
            const topicGrid = overlay.querySelector('#mentionTopicGrid');
            const selectedCount = overlay.querySelector('#mentionSelectedCount');

            function renderMentionTopics() {
                const gid = groupSelect.value;
                const group = data.groups.find(g => g.id === gid);
                if (!group || group.topics.length === 0) {
                    topicGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:20px 0;font-size:0.85rem;">该分组暂无主题</div>';
                    return;
                }
                topicGrid.innerHTML = group.topics.map(t => {
                    const selected = targetSet.has(t.id);
                    return `<div class="mention-topic-item ${selected ? 'selected' : ''}" data-topic-id="${t.id}">${escapeHtml(t.name)}</div>`;
                }).join('');

                topicGrid.querySelectorAll('.mention-topic-item').forEach(item => {
                    item.onclick = () => {
                        const tid = item.dataset.topicId;
                        if (targetSet.has(tid)) targetSet.delete(tid);
                        else targetSet.add(tid);
                        renderMentionTopics();
                        selectedCount.textContent = `已选 ${targetSet.size} 个`;
                    };
                });
            }

            renderMentionTopics();
            groupSelect.onchange = renderMentionTopics;

            overlay.querySelector('#mentionPanelClear').onclick = () => {
                targetSet.clear();
                renderMentionTopics();
                selectedCount.textContent = '已选 0 个';
            };

            overlay.querySelector('#mentionPanelConfirm').onclick = () => {
                overlay.remove();
                if (onConfirm) onConfirm();
            };

            overlay.querySelector('#mentionPanelClose').onclick = () => overlay.remove();
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        mentionBtn.onclick = () => openMentionPanelForSet(pendingMentions, () => {
            renderMentionPreview();
            updateMentionBtnState();
        });

        // ==================== 公告操作 ====================
        document.getElementById('addAnnouncementBtn').onclick = () => {
            if (data.announcement.current && data.announcement.current.trim()) {
                data.announcement.history.unshift({ content: data.announcement.current, createdAt: Date.now() });
                data.announcement.current = '';
                saveMeta();
                renderAnnouncement();
            }
            showAnnouncementEditModal(null);
        };

        document.getElementById('editAnnouncementBtn').onclick = () => {
            if (!data.announcement.current || !data.announcement.current.trim()) { showToast('暂无公告可编辑'); return; }
            data.announcement.history.unshift({ content: data.announcement.current, createdAt: Date.now() });
            const oldContent = data.announcement.current;
            data.announcement.current = '';
            saveMeta();
            renderAnnouncement();
            showAnnouncementEditModal(oldContent);
        };

        document.getElementById('deleteAnnouncementBtn').onclick = async () => {
            if (!data.announcement.current || !data.announcement.current.trim()) { showToast('暂无公告可删除'); return; }
            const ok = await confirmDelete('确定删除当前公告吗？历史记录会保留。');
            if (ok) {
                data.announcement.history.unshift({ content: data.announcement.current, createdAt: Date.now() });
                data.announcement.current = '';
                saveMeta();
                renderAnnouncement();
                showToast('公告已删除，历史记录已保存');
            }
        };

        document.getElementById('historyAnnouncementBtn').onclick = () => showAnnouncementHistoryModal();

        function showAnnouncementEditModal(content) {
            const isEdit = content !== null && content !== undefined;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>${isEdit ? '编辑公告' : '添加公告'}</h3>
                    <textarea id="announcementText" placeholder="输入公告内容...">${isEdit ? escapeHtml(content) : ''}</textarea>
                    <div class="modal-actions">
                        <button class="btn btn-outline" id="annCancel">取消</button>
                        <button class="btn btn-primary" id="annSave">保存</button>
                    </div>
                </div>
            `;
            document.getElementById('modalContainer').appendChild(overlay);
            overlay.querySelector('#announcementText').focus();
            const cleanup = () => overlay.remove();
            overlay.querySelector('#annCancel').onclick = () => { cleanup(); renderAnnouncement(); };
            overlay.querySelector('#annSave').onclick = () => {
                const text = overlay.querySelector('#announcementText').value.trim();
                if (!text) { showToast('公告内容不能为空'); return; }
                data.announcement.current = text;
                saveMeta();
                cleanup();
                renderAnnouncement();
                showToast(isEdit ? '公告已更新' : '公告已添加');
            };
            overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(); });
        }

        function showAnnouncementHistoryModal() {
            const history = data.announcement.history;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            let html = '';
            if (!history || history.length === 0) {
                html = '<div class="history-empty">暂无历史公告</div>';
            } else {
                html = history.map(item => `
                    <div class="history-item">
                        <div class="history-date">${formatFullTime(item.createdAt || Date.now())}</div>
                        <div class="history-content">${escapeHtml(item.content || '')}</div>
                    </div>
                `).join('');
            }
            overlay.innerHTML = `
                <div class="modal" style="max-width:450px;">
                    <h3>📜 历史公告</h3>
                    <div style="max-height:60vh;overflow-y:auto;margin-bottom:12px;">${html}</div>
                    <div class="modal-actions">
                        <button class="btn btn-outline" id="historyClose">关闭</button>
                    </div>
                </div>
            `;
            document.getElementById('modalContainer').appendChild(overlay);
            const cleanup = () => overlay.remove();
            overlay.querySelector('#historyClose').onclick = cleanup;
            overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(); });
        }

        function showEditTopicModal(group, topic = null) {
            const isEdit = !!topic;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>${isEdit ? '编辑主题' : '新建主题'}</h3>
                    <input type="text" id="topicName" placeholder="输入主题名称" value="${isEdit ? escapeHtml(topic.name) : ''}">
                    <div class="modal-actions">
                        <button class="btn btn-outline" id="topicCancel">取消</button>
                        <button class="btn btn-primary" id="topicSave">保存</button>
                    </div>
                </div>
            `;
            document.getElementById('modalContainer').appendChild(overlay);
            overlay.querySelector('#topicName').focus();
            const cleanup = () => overlay.remove();
            overlay.querySelector('#topicCancel').onclick = cleanup;
            overlay.querySelector('#topicSave').onclick = () => {
                const name = overlay.querySelector('#topicName').value.trim();
                if (!name) { showToast('名称不能为空'); return; }
                if (group.topics.some(t => t.name === name && t.id !== (topic ? topic.id : ''))) { showToast('该分组下已存在同名主题'); return; }
                if (isEdit) topic.name = name;
                else group.topics.push({ id: generateId(), name });
                saveMeta();
                cleanup();
                if (currentView === 'home') renderHome();
                else if (currentView === 'topics') renderTopics();
                showToast(isEdit ? '主题已更新' : '主题已创建');
            };
            overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(); });
        }

        function showBatchImportModal(group) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>批量导入主题</h3>
                    <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:8px;">每行一个主题名称，不可与已有主题重复</p>
                    <textarea id="batchTopics" placeholder="主题1&#10;主题2&#10;主题3"></textarea>
                    <div class="modal-actions">
                        <button class="btn btn-outline" id="batchCancel">取消</button>
                        <button class="btn btn-primary" id="batchSave">导入</button>
                    </div>
                </div>
            `;
            document.getElementById('modalContainer').appendChild(overlay);
            overlay.querySelector('#batchTopics').focus();
            const cleanup = () => overlay.remove();
            overlay.querySelector('#batchCancel').onclick = cleanup;
            overlay.querySelector('#batchSave').onclick = () => {
                const lines = overlay.querySelector('#batchTopics').value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                if (lines.length === 0) { showToast('请输入内容'); return; }
                let imported = 0, skipped = 0;
                for (const name of lines) {
                    if (group.topics.some(t => t.name === name)) { skipped++; continue; }
                    group.topics.push({ id: generateId(), name });
                    imported++;
                }
                saveMeta();
                cleanup();
                if (currentView === 'topics') renderTopics();
                if (currentView === 'home') renderHome();
                showToast(`导入 ${imported} 个，跳过 ${skipped} 个重复`);
            };
            overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(); });
        }

        function showNoteContentModal(note, groupId, topicId) {
            const isEdit = !!note;
            const currentMentions = new Set(note ? (note.mentions || []) : []);
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>${isEdit ? '编辑记事' : '新建记事'}</h3>
                    <textarea id="noteContent" placeholder="输入记事内容...">${isEdit ? escapeHtml(note.content) : ''}</textarea>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">
                        <button class="mention-btn" id="modalMentionBtn" type="button">@ 关联主题</button>
                        <div class="mention-preview" id="modalMentionPreview" style="margin-top:0;"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-outline" id="noteCancel">取消</button>
                        <button class="btn btn-primary" id="noteSave">保存</button>
                    </div>
                </div>
            `;
            document.getElementById('modalContainer').appendChild(overlay);
            overlay.querySelector('#noteContent').focus();
            const cleanup = () => overlay.remove();

            function updateModalMentionUI() {
                const preview = overlay.querySelector('#modalMentionPreview');
                if (currentMentions.size === 0) {
                    preview.innerHTML = '';
                } else {
                    preview.innerHTML = Array.from(currentMentions).map(mid => {
                        const info = getTopicGroup(mid);
                        return info ? `<span class="mention-chip">@${escapeHtml(info.topic.name)}</span>` : '';
                    }).join('');
                }
                const btn = overlay.querySelector('#modalMentionBtn');
                if (currentMentions.size > 0) {
                    btn.classList.add('active');
                    btn.textContent = `@ 关联主题 (${currentMentions.size})`;
                } else {
                    btn.classList.remove('active');
                    btn.textContent = '@ 关联主题';
                }
            }

            updateModalMentionUI();

            overlay.querySelector('#modalMentionBtn').onclick = () => {
                openMentionPanelForSet(currentMentions, updateModalMentionUI);
            };

            overlay.querySelector('#noteCancel').onclick = cleanup;
            overlay.querySelector('#noteSave').onclick = () => {
                const content = overlay.querySelector('#noteContent').value.trim();
                if (!content) { showToast('内容不能为空'); return; }
                const mentionsArr = Array.from(currentMentions);
                if (isEdit) {
                    note.content = content;
                    note.createdAt = Date.now();
                    note.mentions = mentionsArr;
                    saveNote(note);
                } else {
                    const newNote = {
                        id: generateId(),
                        groupId, topicId,
                        content,
                        createdAt: Date.now(),
                        mentions: mentionsArr,
                        sourceTopicId: null
                    };
                    saveNote(newNote);
                }
                cleanup();
                if (currentView === 'home') renderHome();
                else if (currentView === 'notes') renderNotes();
                else if (currentView === 'search') renderSearchResults();
                else if (currentView === 'topics') renderTopics();
                showToast(isEdit ? '已更新' : '已添加');
            };
            overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(); });
        }

        document.getElementById('saveNoteBtn').onclick = () => {
            const textarea = document.getElementById('newNoteContent');
            const content = textarea.value.trim();
            if (!content) { showToast('请输入记事内容'); return; }
            if (!currentGroupId || !currentTopicId) { showToast('请先选择主题'); return; }

            const mentionsArr = Array.from(pendingMentions);
            const newNote = {
                id: generateId(),
                groupId: currentGroupId,
                topicId: currentTopicId,
                content: content,
                createdAt: Date.now(),
                mentions: mentionsArr,
                sourceTopicId: null
            };
            saveNote(newNote);

            if (data.preferences.mentionCopyMode && mentionsArr.length > 0) {
                mentionsArr.forEach(mid => {
                    if (mid === currentTopicId) return;
                    const info = getTopicGroup(mid);
                    if (!info) return;
                    const copyNote = {
                        id: generateId(),
                        groupId: info.group.id,
                        topicId: mid,
                        content: content,
                        createdAt: Date.now(),
                        mentions: [currentTopicId],
                        sourceTopicId: currentTopicId
                    };
                    saveNote(copyNote);
                });
            }

            textarea.value = '';
            pendingMentions.clear();
            renderMentionPreview();
            updateMentionBtnState();
            renderNotes();
            showToast(mentionsArr.length > 0 ? `已保存并关联 ${mentionsArr.length} 个主题` : '已保存');
        };

        let multiInsertedTopics = new Set();

        function initBatchView() {
            const groupSelect = document.getElementById('multiGroupSelect');
            groupSelect.innerHTML = data.groups.map(g =>
                `<option value="${g.id}">${escapeHtml(g.name)}</option>`
            ).join('');

            if (currentGroupId && data.groups.some(g => g.id === currentGroupId)) {
                groupSelect.value = currentGroupId;
            }

            renderMultiTopicArea();
            updateMultiInsertedCount();
            groupSelect.onchange = renderMultiTopicArea;
            multiInsertedTopics = new Set();
        }

        function renderMultiTopicArea() {
            const groupId = document.getElementById('multiGroupSelect').value;
            const group = data.groups.find(g => g.id === groupId);
            const area = document.getElementById('multiTopicArea');
            if (!group || group.topics.length === 0) {
                area.innerHTML = '<div style="color:var(--text-light);font-size:0.85rem;padding:8px 0;">该分组暂无主题</div>';
                return;
            }
            area.innerHTML = group.topics.map(t => {
                const inserted = multiInsertedTopics.has(t.id);
                return `<button class="topic-btn ${inserted ? 'inserted' : ''}" data-topic-id="${t.id}">${escapeHtml(t.name)}${inserted ? ' ✓' : ''}</button>`;
            }).join('');

            area.querySelectorAll('.topic-btn').forEach(btn => {
                btn.onclick = () => {
                    const content = document.getElementById('multiNoteContent').value.trim();
                    if (!content) { showToast('请先输入记事内容'); return; }
                    const topicId = btn.dataset.topicId;
                    if (multiInsertedTopics.has(topicId)) {
                        showToast('该主题已插入过这条记事');
                        return;
                    }
                    const newNote = {
                        id: generateId(),
                        groupId: groupId,
                        topicId: topicId,
                        content: content,
                        createdAt: Date.now(),
                        mentions: [],
                        sourceTopicId: null
                    };
                    saveNote(newNote);
                    multiInsertedTopics.add(topicId);
                    renderMultiTopicArea();
                    updateMultiInsertedCount();
                    showToast('已插入');
                };
            });
        }

        function updateMultiInsertedCount() {
            document.getElementById('multiInsertedCount').textContent = multiInsertedTopics.size;
        }

        function performTableImport() {
            const raw = document.getElementById('tableImportContent').value;
            if (!raw.trim()) { showToast('请粘贴表格内容'); return; }

            const lines = raw.split('\n').map(l => l.replace(/\r$/, '')).filter(l => l.trim().length > 0);
            if (lines.length < 2) { showToast('至少需要两行（标题行 + 数据行）'); return; }

            const headerCells = lines[0].split('\t').map(s => s.trim());
            const groupNames = headerCells.slice(1);

            if (groupNames.length === 0) { showToast('未找到分组名'); return; }

            let noteCount = 0;
            let topicCreated = 0;
            let groupCreated = 0;
            const newNotes = [];

            for (let i = 1; i < lines.length; i++) {
                const cells = lines[i].split('\t').map(s => s.trim());
                const topicName = cells[0];
                if (!topicName) continue;

                for (let j = 0; j < groupNames.length; j++) {
                    const groupName = groupNames[j];
                    const content = cells[j + 1];
                    if (!groupName) continue;
                    if (!content || !content.trim()) continue;

                    let group = data.groups.find(g => g.name === groupName);
                    if (!group) {
                        group = { id: generateId(), name: groupName, isDefault: false, topics: [] };
                        data.groups.push(group);
                        groupCreated++;
                    }

                    let topic = group.topics.find(t => t.name === topicName);
                    if (!topic) {
                        topic = { id: generateId(), name: topicName };
                        group.topics.push(topic);
                        topicCreated++;
                    }

                    newNotes.push({
                        id: generateId(),
                        groupId: group.id,
                        topicId: topic.id,
                        content: content.trim(),
                        createdAt: Date.now(),
                        mentions: [],
                        sourceTopicId: null
                    });
                    noteCount++;
                }
            }

            if (noteCount === 0) {
                showToast('没有可导入的记事内容');
                return;
            }

            for (const n of newNotes) {
                saveNote(n);
            }
            saveMeta();
            saveNotesIndex();
            document.getElementById('tableImportContent').value = '';
            showToast(`导入完成：新建 ${groupCreated} 个分组、${topicCreated} 个主题，共 ${noteCount} 条记事`);
        }

        document.getElementById('drawerSortToggle').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const sort = btn.dataset.sort;
            if (sort === data.preferences.drawerSort) return;
            data.preferences.drawerSort = sort;
            saveMeta();
            renderSortToggle(document.getElementById('drawerSortToggle'), sort);
            renderDrawerGroups();
            const labels = { default: '默认顺序', pinyin: '拼音', count: '记事数' };
            showToast('分组按' + labels[sort] + '排序');
        });

        document.getElementById('homeTopicSortToggle').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const sort = btn.dataset.sort;
            if (sort === data.preferences.topicSort) return;
            data.preferences.topicSort = sort;
            saveMeta();
            renderSortToggle(document.getElementById('homeTopicSortToggle'), sort);
            renderHome();
            const labels = { default: '默认顺序', pinyin: '拼音', count: '记事数' };
            showToast('主题按' + labels[sort] + '排序');
        });

        document.getElementById('topicSortToggle').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const sort = btn.dataset.sort;
            if (sort === data.preferences.topicSort) return;
            data.preferences.topicSort = sort;
            saveMeta();
            renderSortToggle(document.getElementById('topicSortToggle'), sort);
            renderTopics();
            const labels = { default: '默认顺序', pinyin: '拼音', count: '记事数' };
            showToast('主题按' + labels[sort] + '排序');
        });

        document.getElementById('mentionCopyMode').addEventListener('change', (e) => {
            data.preferences.mentionCopyMode = e.target.checked;
            saveMeta();
            showToast(e.target.checked ? '已开启：同时复制到被@的主题' : '已关闭：仅建立关联');
        });

        document.getElementById('menuBtn').onclick = openDrawer;
        drawerOverlay.onclick = closeDrawer;

        document.getElementById('topicsBackBtn').onclick = () => switchView('home');
        document.getElementById('notesBackBtn').onclick = () => switchView('topics');
        document.getElementById('batchBackBtn').onclick = () => switchView('home');
        fabHomeBtn.onclick = () => switchView('home');

        document.getElementById('manageGroupsBtn').onclick = () => { closeDrawer(); showGroupsManageModal(); };
        document.getElementById('exportBtn').onclick = () => { closeDrawer(); exportAllData(); };
        document.getElementById('importBtn').onclick = () => {
            closeDrawer();
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json,application/json';
            fileInput.onchange = (e) => { const file = e.target.files[0]; if (file) importDataFromFile(file); };
            fileInput.click();
        };
        document.getElementById('batchBtn').onclick = () => { closeDrawer(); switchView('batch'); };

        document.getElementById('addTopicBtn').onclick = () => {
            const group = data.groups.find(g => g.id === currentGroupId);
            if (group) showEditTopicModal(group, null);
        };
        document.getElementById('batchImportBtn').onclick = () => {
            const group = data.groups.find(g => g.id === currentGroupId);
            if (group) showBatchImportModal(group);
        };

        document.getElementById('tableImportBtn').onclick = performTableImport;
        document.getElementById('tableImportClear').onclick = () => {
            document.getElementById('tableImportContent').value = '';
            showToast('已清空');
        };

        searchInput.addEventListener('input', (e) => {
            searchKeyword = e.target.value;
            if (searchKeyword.trim()) {
                if (currentView !== 'search') switchView('search');
                else renderSearchResults();
            } else {
                if (currentView === 'search') switchView('home');
            }
        });
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });

        function showGroupsManageModal() {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>📂 管理分组</h3>
                    <div id="manageGroupsList" style="margin-bottom:14px;"></div>
                    <div class="modal-actions" style="justify-content: space-between;">
                        <button class="btn btn-primary" id="mgAddGroup">+ 新建分组</button>
                        <button class="btn btn-outline" id="mgClose">关闭</button>
                    </div>
                </div>
            `;
            document.getElementById('modalContainer').appendChild(overlay);
            const listEl = overlay.querySelector('#manageGroupsList');

            function renderList() {
                listEl.innerHTML = data.groups.map(g => `
                    <div class="mg-row">
                        <span style="font-size:0.9rem;">
                            ${escapeHtml(g.name)}
                            ${g.isDefault ? '<span style="font-size:0.65rem;background:#f59e0b;color:white;padding:1px 6px;border-radius:8px;margin-left:4px;">默认</span>' : ''}
                        </span>
                        <span style="display:flex;gap:2px;">
                            ${!g.isDefault ? `<button class="icon-btn mg-set-default" data-id="${g.id}" title="设为默认">⭐</button>` : ''}
                            <button class="icon-btn mg-rename" data-id="${g.id}" title="重命名">✏️</button>
                            <button class="icon-btn mg-delete" data-id="${g.id}" title="删除">🗑️</button>
                        </span>
                    </div>
                `).join('') || '<div class="empty-tip">暂无分组</div>';

                listEl.querySelectorAll('.mg-set-default').forEach(btn => {
                    btn.onclick = () => {
                        data.groups.forEach(g => g.isDefault = (g.id === btn.dataset.id));
                        saveMeta();
                        renderList();
                        renderDrawerGroups();
                        showToast('已设为默认分组');
                    };
                });
                listEl.querySelectorAll('.mg-rename').forEach(btn => {
                    btn.onclick = () => {
                        const group = data.groups.find(g => g.id === btn.dataset.id);
                        if (!group) return;
                        const newName = prompt('输入新的分组名称：', group.name);
                        if (newName && newName.trim()) {
                            group.name = newName.trim();
                            saveMeta();
                            renderList();
                            renderDrawerGroups();
                            showToast('已重命名');
                        }
                    };
                });
                listEl.querySelectorAll('.mg-delete').forEach(btn => {
                    btn.onclick = async () => {
                        const group = data.groups.find(g => g.id === btn.dataset.id);
                        if (!group) return;
                        if (group.isDefault) { showToast('默认分组不能删除'); return; }
                        if (group.topics.length > 0) { showToast('请先删除该分组内所有主题'); return; }
                        const ok = await confirmDelete(`确定删除分组「${group.name}」吗？`);
                        if (ok) {
                            data.groups = data.groups.filter(g => g.id !== group.id);
                            saveMeta();
                            renderList();
                            renderDrawerGroups();
                            showToast('分组已删除');
                        }
                    };
                });
            }

            renderList();

            overlay.querySelector('#mgAddGroup').onclick = () => {
                const name = prompt('输入新分组名称：');
                if (!name || !name.trim()) return;
                if (data.groups.some(g => g.name === name.trim())) { showToast('已存在同名分组'); return; }
                data.groups.push({ id: generateId(), name: name.trim(), isDefault: false, topics: [] });
                saveMeta();
                renderList();
                renderDrawerGroups();
                showToast('分组已创建');
            };
            overlay.querySelector('#mgClose').onclick = () => overlay.remove();
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        // ==================== 启动 ====================
        initLoad();
        switchView('home');
    })();
</script>
</body>
</html>
